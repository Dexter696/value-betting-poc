name: VB Capture Pipeline

# POC phase only: runs on GitHub-hosted runners so capture keeps going
# even when the local PC is off. The database lives in Actions cache
# (never committed to git - it grows continuously and would blow past
# GitHub's 100MB per-file limit within hours). See scripts/scheduled_run.py
# for the pruning that keeps the cached DB bounded in size.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: vb-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: data/vb.sqlite
          key: vb-db-${{ github.run_id }}
          restore-keys: |
            vb-db-

      - name: Run capture + pipeline cycle
        run: python scripts/scheduled_run.py
