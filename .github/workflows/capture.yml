name: VB Capture Pipeline

# POC phase only: runs on GitHub-hosted runners so capture keeps going
# even when the local PC is off. The database lives in Actions cache
# (never committed to git - it grows continuously and would blow past
# GitHub's 100MB per-file limit within hours). See scripts/scheduled_run.py
# for the pruning that keeps the cached DB bounded in size.
on:
  schedule:
    # Quick cycle: Pinnacle + Loro + quick single-page Swisslos fetch.
    - cron: "*/5 * * * *"
    # Full-breadth Swisslos sweep (~5min on its own - see
    # SwisslosClient.fetch_all_countries()) - offset from the */5 grid
    # (7/27/47 rather than a multiple of 5) so the two schedules never
    # fire in the same minute and queue up on each other.
    - cron: "7,27,47 * * * *"
    # Swisslos Asian Handicap sweep: one detail-page visit per match
    # (see SwisslosClient.fetch_all_handicaps docstring) - tens of
    # minutes, so this runs once daily rather than every few minutes,
    # accepting stale handicap odds most of the time in exchange for not
    # blocking the fast-moving quick cycle. Minute 13 doesn't collide
    # with either of the other two schedules' grids.
    - cron: "13 3 * * *"
  workflow_dispatch:
    inputs:
      db_sync:
        description: >
          Database sync action for reconciling local vs. GitHub-side data
          (see scripts/merge_databases.py). "export" uploads the current
          cached DB as a build artifact so it can be downloaded and merged
          locally; "import" downloads the "db-sync" release asset (a
          locally-merged DB) and uses it going forward instead of whatever
          the cache currently holds. Both skip the normal capture cycle for
          that one run.
        type: choice
        options: [none, export, import]
        default: none

concurrency:
  group: vb-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # F-08: the "Backup database to db-sync release" step's
    # `gh release upload` needs contents: write on the auto-generated
    # GITHUB_TOKEN. With no permissions block at all, this job fell
    # back to the repo's default token permissions - confirmed live
    # 2026-07-29 that this defaults to read-only here, so every daily
    # handicap-sweep cycle's backup step failed with a 403 and the job
    # was reported as failed, even though the actual capture+pipeline
    # work in the same run had already completed successfully.
    permissions:
      contents: write
    # The Asian Handicap sweep (one page load per match, hundreds of
    # matches) is the long pole here - tens of minutes, vs ~5min for the
    # full-breadth Swisslos sweep and ~2min for the quick cycle.
    timeout-minutes: 65
    outputs:
      dashboard-built: ${{ steps.build-dashboard.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: data/vb.sqlite
          key: vb-db-${{ github.run_id }}
          restore-keys: |
            vb-db-

      - name: Export DB as build artifact
        if: github.event.inputs.db_sync == 'export'
        uses: actions/upload-artifact@v4
        with:
          name: vb-db-export
          path: data/vb.sqlite
          retention-days: 3

      - name: Import DB from db-sync release
        if: github.event.inputs.db_sync == 'import'
        run: |
          gh release download db-sync --repo "${{ github.repository }}" --pattern vb.sqlite --output data/vb.sqlite --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run capture + pipeline cycle
        if: github.event.inputs.db_sync == 'none' || github.event.inputs.db_sync == ''
        run: |
          if [ "${{ github.event.schedule }}" = "13 3 * * *" ]; then
            python scripts/scheduled_run.py --full-handicaps
          elif [ "${{ github.event.schedule }}" = "7,27,47 * * * *" ]; then
            python scripts/scheduled_run.py --full-swisslos
          else
            python scripts/scheduled_run.py
          fi

      # Durable backup, independent of the Actions cache: the cache is
      # ephemeral (LRU-evicted, no audit trail, no recovery path if a
      # write ever silently fails) - the only thing standing between
      # "never lose any data" and a bad day is this. Piggybacks on the
      # once-daily handicap-sweep cron as a natural low-frequency trigger
      # (not every 5min - a release upload of the full DB isn't free,
      # and daily recovery-point granularity is enough for a backup of
      # last resort). Release assets aren't subject to cache eviction at
      # all, so this is meaningfully more durable than the cache, not
      # just a second copy of the same risk.
      #
      # always() (2026-07-29, found by self-review after F-16): the
      # "Run capture + pipeline cycle" step can now exit non-zero on a
      # total capture failure (F-16) - without always(), GitHub Actions'
      # default behavior skips every later step once one fails, which
      # would silently defeat this backup on exactly the day the
      # pipeline is unhealthy and a backup matters most. The job as a
      # whole still reports failed (that's the whole point of F-16);
      # always() only keeps THIS step itself from being skipped.
      - name: Backup database to db-sync release
        if: always() && github.event.schedule == '13 3 * * *' && (github.event.inputs.db_sync == 'none' || github.event.inputs.db_sync == '')
        run: gh release upload db-sync data/vb.sqlite --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Every cycle regenerates the dashboard from whatever's in the DB
      # at that point and republishes it to GitHub Pages - a persistent,
      # always-fresh URL instead of a manually-regenerated, manually-
      # republished Claude Artifact. dashboard.html itself is gitignored
      # (self-contained/embeds JSON data, no reason to commit it) - the
      # upload-pages-artifact/deploy-pages actions below publish it
      # straight to Pages hosting without ever needing a git commit.
      # Runs on import too (not just the normal cycle) so a DB sync
      # immediately republishes the dashboard with the reconciled data;
      # skipped on export since nothing changed there. always() for the
      # same F-16 reason as the backup step above - a capture failure
      # must not also silently stop the dashboard from reflecting
      # whatever state the DB is actually in.
      - name: Build dashboard
        id: build-dashboard
        if: always() && github.event.inputs.db_sync != 'export'
        run: |
          mkdir -p public
          python scripts/build_dashboard.py public/index.html

      - name: Upload dashboard artifact
        if: always() && github.event.inputs.db_sync != 'export' && steps.build-dashboard.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: capture
    if: needs.capture.outputs.dashboard-built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
