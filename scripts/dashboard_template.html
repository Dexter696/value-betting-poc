<title>Value Betting — Dashboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f4f3f0;
    --surface-3:      #eeece7;
    --border:         #e4e2dc;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #85837c;
    --good:           #008300;
    --bad:            #e34948;
    --accent:         #2a78d6;
    --amber:          #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19; --surface-2: #232320; --surface-3: #2b2b27; --border: #3a3934;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8d84;
      --good: #008300; --bad: #e66767; --accent: #3987e5; --amber: #c98500;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #232320; --surface-3: #2b2b27; --border: #3a3934;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8d84;
    --good: #008300; --bad: #e66767; --accent: #3987e5; --amber: #c98500;
  }

  .viz-root {
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 28px 20px 60px;
    max-width: 920px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .viz-root * { box-sizing: border-box; }
  .viz-root h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
  .tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .tile .value { font-size: 20px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .label { font-size: 10.5px; color: var(--text-secondary); margin-top: 4px; }

  .controls {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 16px; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  }
  .controls input[type="text"] {
    flex: 1; min-width: 160px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); font-size: 13px;
  }
  .controls select {
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px;
  }
  .controls .count { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .filter-btn {
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary); font-size: 12px; cursor: pointer;
  }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  details.card {
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    background: var(--surface-2); overflow: hidden;
  }
  details.card[open] { background: var(--surface-1); }
  summary.card-summary {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    cursor: pointer; list-style: none; font-size: 13px;
  }
  summary.card-summary::-webkit-details-marker { display: none; }
  summary.card-summary .chev { color: var(--text-muted); font-size: 11px; width: 10px; }
  details[open] summary .chev { transform: rotate(90deg); }
  .card-match { font-weight: 600; flex: 0 0 auto; min-width: 220px; }
  .card-leg { color: var(--text-secondary); font-size: 12px; flex: 0 0 auto; min-width: 140px; }
  .card-edges { display: flex; gap: 14px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .card-edges .lbl { color: var(--text-muted); font-size: 10px; display: block; }
  .card-edges .val { font-weight: 600; }
  .status-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 7px;
    border-radius: 4px; color: white; flex: 0 0 auto;
  }
  .status-open { background: var(--accent); }
  .status-won { background: var(--good); }
  .status-lost { background: var(--bad); }
  .status-push, .status-half_won, .status-half_lost { background: var(--amber); }
  .status-unsettled { background: var(--text-muted); }

  .card-body { padding: 4px 14px 16px; }
  .mini-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .mini-summary .tile { padding: 8px 10px; }
  .mini-summary .value { font-size: 16px; }

  .chart-wrap { background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px 4px; margin-bottom: 14px; }
  .chart-legend { display: flex; gap: 14px; font-size: 10.5px; color: var(--text-secondary); margin-bottom: 4px; }
  .chart-legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    text-align: left; font-weight: 500; color: var(--text-secondary);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 0 7px 6px; border-bottom: 1px solid var(--border);
  }
  th.num, td.num { text-align: right; }
  td { padding: 6px 7px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.pre-entry td { opacity: 0.6; }
  tr.row-peak td { background: color-mix(in srgb, var(--amber) 10%, transparent); }
  tr.row-close td { background: color-mix(in srgb, var(--bad) 8%, transparent); }
  .odds, .num.plain { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .edge-pos { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--good); }
  .edge-neg { font-variant-numeric: tabular-nums; color: var(--bad); }
  .tag {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.02em;
    padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; color: white;
  }
  .tag.entry { background: var(--accent); }
  .tag.peak { background: var(--amber); }
  .tag.close { background: var(--bad); }
  .moved { font-size: 10px; color: var(--text-muted); }

  .empty { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
  footer { margin-top: 16px; font-size: 11px; color: var(--text-muted); }
</style>

<div class="viz-root">
  <h1>Value Betting — dashboard</h1>
  <p class="subtitle" id="subtitle">data/vb.sqlite</p>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search match or competition..." />
    <select id="statusFilter">
      <option value="all">All statuses</option>
      <option value="open">Open</option>
      <option value="closed">Closed (any)</option>
      <option value="won">Won</option>
      <option value="lost">Lost</option>
      <option value="unsettled">Closed, unsettled</option>
    </select>
    <select id="sortBy">
      <option value="recent">Most recent</option>
      <option value="peak">Peak edge (desc)</option>
      <option value="entry">Entry edge (desc)</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
  <footer id="footer"></footer>
</div>

<script>
const DATA = __DASHBOARD_DATA__;

function pct(x) { return (x * 100).toFixed(1) + '%'; }
function edgeClass(x) { return x >= 0 ? 'edge-pos' : 'edge-neg'; }
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toISOString().slice(11, 19) + ' UTC';
}
function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined) return null;
  const m = Math.round(seconds / 60);
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
}

function statusOf(opp) {
  if (opp.isOpen) return { key: 'open', label: 'OPEN' };
  if (opp.outcome === 'won' || opp.outcome === 'half_won') return { key: 'won', label: opp.outcome === 'half_won' ? 'HALF WON' : 'WON' };
  if (opp.outcome === 'lost' || opp.outcome === 'half_lost') return { key: 'lost', label: opp.outcome === 'half_lost' ? 'HALF LOST' : 'LOST' };
  if (opp.outcome === 'push') return { key: 'push', label: 'PUSH' };
  return { key: 'unsettled', label: 'CLOSED' };
}

function movementLabel(prev, cur) {
  if (!prev) return 'first reading';
  const bmMoved = Math.abs(prev.benchmarkOdds - cur.benchmarkOdds) > 1e-6;
  const cmpMoved = Math.abs(prev.comparisonOdds - cur.comparisonOdds) > 1e-6;
  if (bmMoved && cmpMoved) return 'both moved';
  if (bmMoved) return 'benchmark moved';
  if (cmpMoved) return 'comparison moved';
  return 'no change';
}

function buildChartSVG(points) {
  if (points.length === 0) return '<p class="moved">No trajectory data.</p>';
  const edges = points.map(p => p.edgeA * 100);
  let min = Math.min(0, ...edges);
  let max = Math.max(3, ...edges);
  const pad = Math.max((max - min) * 0.12, 1);
  min -= pad; max += pad;

  const x0 = 45, x1 = 700, yTop = 10, yBot = 170;
  const xFor = i => points.length <= 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (points.length - 1);
  const yFor = e => yTop + (max - e) / (max - min) * (yBot - yTop);

  const zeroY = yFor(0), threeY = yFor(3);
  let svg = '';
  if (min < 0) svg += `<line x1="${x0}" y1="${zeroY}" x2="${x1}" y2="${zeroY}" stroke="#85837c" stroke-width="1" stroke-dasharray="2,3"/><text x="${x1+2}" y="${zeroY+4}" font-size="9" fill="#85837c">0%</text>`;
  if (max >= 3) svg += `<line x1="${x0}" y1="${threeY}" x2="${x1}" y2="${threeY}" stroke="#eda100" stroke-width="1.5" stroke-dasharray="4,3"/><text x="${x1+2}" y="${threeY+4}" font-size="9" fill="#85837c">3%</text>`;
  svg += `<line x1="${x0}" y1="10" x2="${x0}" y2="${yBot}" stroke="#e4e2dc" stroke-width="1"/><line x1="${x0}" y1="${yBot}" x2="${x1}" y2="${yBot}" stroke="#e4e2dc" stroke-width="1"/>`;
  svg += `<text x="${x0-6}" y="14" font-size="9" fill="#85837c" text-anchor="end">${max.toFixed(0)}%</text>`;
  svg += `<text x="${x0-6}" y="${yBot}" font-size="9" fill="#85837c" text-anchor="end">${min.toFixed(0)}%</text>`;

  const poly = points.map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.edgeA * 100).toFixed(1)}`).join(' ');
  svg += `<polyline points="${poly}" fill="none" stroke="#2a78d6" stroke-width="2.2"/>`;

  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.edgeA * 100);
    let r = 3, fill = p.isPre ? '#85837c' : '#2a78d6', stroke = 'none', sw = 0;
    if (p.isEntry) { r = 4.5; }
    if (p.isPeak) { r = 5; fill = '#eda100'; stroke = '#2a78d6'; sw = 1.5; }
    if (p.isClose) { r = 5; fill = '#e34948'; stroke = '#2a78d6'; sw = 1.5; }
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" ${stroke !== 'none' ? `stroke="${stroke}" stroke-width="${sw}"` : ''}/>`;
  });

  return `<svg viewBox="0 0 720 190" width="100%" style="overflow:visible">${svg}</svg>`;
}

function buildTable(opp) {
  const preRows = opp.preEntry.map((h, i) => {
    const prev = i > 0 ? opp.preEntry[i - 1] : null;
    return `<tr class="pre-entry">
      <td class="odds">${fmtTime(h.capturedAt)}</td>
      <td class="num odds">${h.benchmarkOdds}</td>
      <td class="num odds">${h.comparisonOdds}</td>
      <td class="num ${edgeClass(h.edgeA)}">${pct(h.edgeA)}</td>
      <td class="num odds">—</td>
      <td class="moved">${movementLabel(prev, h)} (below threshold)</td>
    </tr>`;
  }).join('');

  const peakIdx = opp.snapshots.reduce((best, s, i) => s.edgeA > opp.snapshots[best].edgeA ? i : best, 0);
  const lastPre = opp.preEntry.length ? opp.preEntry[opp.preEntry.length - 1] : null;

  const snapRows = opp.snapshots.map((s, i) => {
    const isEntry = i === 0;
    const isPeak = i === peakIdx && opp.snapshots.length > 1;
    const isClose = i === opp.snapshots.length - 1 && !opp.isOpen;
    const prev = i > 0 ? opp.snapshots[i - 1] : lastPre;
    let cls = '';
    if (isPeak) cls = 'row-peak'; else if (isClose) cls = 'row-close';
    const tags = [isEntry ? '<span class="tag entry">ENTRY</span>' : '', isPeak ? '<span class="tag peak">PEAK</span>' : '', isClose ? '<span class="tag close">CLOSED</span>' : ''].join('');
    const moveNote = isClose && opp.resolutionReason === 'event_started' ? 'kickoff' : (isClose && opp.resolutionReason === 'market_suspended' ? 'market suspended' : movementLabel(prev, s));
    return `<tr class="${cls}">
      <td class="odds">${fmtTime(s.capturedAt)}${tags}</td>
      <td class="num odds">${s.benchmarkOdds}</td>
      <td class="num odds">${s.comparisonOdds}</td>
      <td class="num ${edgeClass(s.edgeA)}">${pct(s.edgeA)}</td>
      <td class="num ${edgeClass(s.edgeB)}">${pct(s.edgeB)}</td>
      <td class="moved">${moveNote}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr><th>Time</th><th class="num">Benchmark</th><th class="num">Comparison</th><th class="num">Edge (raw)</th><th class="num">Edge (de-vig)</th><th>What moved</th></tr></thead>
    <tbody>${preRows}${snapRows}</tbody>
  </table>`;
}

function buildCard(opp) {
  const status = statusOf(opp);
  const lineStr = opp.line !== null ? ' ' + opp.line : '';
  const legDesc = `${opp.marketType.replace('_', ' ')}${lineStr} · ${opp.selection}`;
  const convergence = fmtDuration(opp.convergenceSeconds);

  const chartPoints = [
    ...opp.preEntry.map(h => ({ edgeA: h.edgeA, isPre: true })),
    ...opp.snapshots.map((s, i, arr) => ({
      edgeA: s.edgeA,
      isEntry: i === 0,
      isPeak: i === arr.reduce((best, x, j) => x.edgeA > arr[best].edgeA ? j : best, 0) && arr.length > 1,
      isClose: i === arr.length - 1 && !opp.isOpen,
    })),
  ];

  const resultLine = opp.outcome
    ? `${opp.home} ${opp.homeGoals}–${opp.awayGoals} ${opp.away}`
    : (opp.isOpen ? 'match not finished yet' : 'closed, result not recorded');

  return `<details class="card">
    <summary class="card-summary">
      <span class="chev">▶</span>
      <span class="card-match">${opp.home} vs ${opp.away}</span>
      <span class="card-leg">${legDesc}<br><span style="opacity:0.7">vs. ${opp.comparisonSite}</span></span>
      <span class="card-edges">
        <span><span class="lbl">entry</span><span class="val ${edgeClass(opp.entryEdgeA)}">${pct(opp.entryEdgeA)}</span></span>
        <span><span class="lbl">peak</span><span class="val ${edgeClass(opp.peakEdgeA)}">${pct(opp.peakEdgeA)}</span></span>
      </span>
      <span class="status-badge status-${status.key}">${status.label}</span>
    </summary>
    <div class="card-body">
      <div class="mini-summary">
        <div class="tile"><div class="value ${edgeClass(opp.entryEdgeA)}">${pct(opp.entryEdgeA)}</div><div class="label">entry edge</div></div>
        <div class="tile"><div class="value ${edgeClass(opp.peakEdgeA)}">${pct(opp.peakEdgeA)}</div><div class="label">peak edge</div></div>
        <div class="tile"><div class="value">${convergence || (opp.isOpen ? 'still open' : 'n/a')}</div><div class="label">time to converge</div></div>
        <div class="tile"><div class="value">${resultLine}</div><div class="label">${opp.competition}</div></div>
      </div>
      <div class="chart-wrap">
        <div class="chart-legend">
          <span><span class="dot" style="background:#2a78d6"></span>edge (raw)</span>
          <span><span class="dot" style="background:#85837c"></span>pre-entry (below threshold)</span>
          <span><span class="dot" style="background:#eda100"></span>peak</span>
          <span><span class="dot" style="background:#e34948"></span>close</span>
        </div>
        ${buildChartSVG(chartPoints)}
      </div>
      ${buildTable(opp)}
    </div>
  </details>`;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let items = DATA.opportunities.filter(opp => {
    if (q) {
      const hay = `${opp.home} ${opp.away} ${opp.competition}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (statusF === 'all') return true;
    const s = statusOf(opp).key;
    if (statusF === 'closed') return !opp.isOpen;
    return s === statusF;
  });

  if (sortBy === 'peak') items = items.slice().sort((a, b) => b.peakEdgeA - a.peakEdgeA);
  else if (sortBy === 'entry') items = items.slice().sort((a, b) => b.entryEdgeA - a.entryEdgeA);
  else items = items.slice().sort((a, b) => new Date(b.firstCrossAt) - new Date(a.firstCrossAt));

  document.getElementById('count').textContent = `${items.length} of ${DATA.opportunities.length}`;
  document.getElementById('list').innerHTML = items.length
    ? items.map(buildCard).join('')
    : '<div class="empty">No opportunities match this filter.</div>';
}

function renderTiles() {
  const s = DATA.stats;
  document.getElementById('tiles').innerHTML = `
    <div class="tile"><div class="value">${s.matchesCaptured.toLocaleString()}</div><div class="label">matches captured</div></div>
    <div class="tile"><div class="value">${s.oddsSnapshots.toLocaleString()}</div><div class="label">odds snapshots</div></div>
    <div class="tile"><div class="value">${s.liveOpportunities}</div><div class="label">live opportunities</div></div>
    <div class="tile"><div class="value">${s.resolvedOpportunities}</div><div class="label">resolved opportunities</div></div>
    <div class="tile"><div class="value">${s.pendingReviews}</div><div class="label">pending review</div></div>
  `;
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('sortBy').addEventListener('change', render);

renderTiles();
render();
document.getElementById('footer').textContent = 'Pre-entry rows are reconstructed from raw capture history, not originally stored (they never crossed 3%). Click any row to expand its full trajectory.';
</script>
